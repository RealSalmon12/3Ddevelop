name: 빌드

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: 타입 검사와 빌드
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  windows-installer:
    name: Windows 설치 파일 (${{ matrix.title }})
    needs: check
    # main 에 병합될 때만 설치 파일을 만들어 Releases 에 올린다.
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: hub
            title: 누구나 스튜디오 허브
            latest: "true"
          - app: modeler
            title: 3D 모델러
            latest: "false"
          - app: pixel
            title: 픽셀 그림판
            latest: "false"
          - app: photo
            title: 사진 편집기
            latest: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 이 앱이나 공통 패키지가 바뀌었을 때만 새로 만든다. 안 바뀐 앱은 업데이트 알림이 뜨지 않는다.
      - name: 바뀐 게 있는지 보기
        id: changed
        shell: bash
        run: |
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" != "push" ] || [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$before" "${{ github.sha }}" | grep -qE '^(apps/${{ matrix.app }}/|packages/|package-lock\.json|package\.json|tsconfig\.base\.json|\.github/workflows/build\.yml)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.title }}: 바뀐 게 없어서 건너뛰어요."
          fi
      - uses: actions/setup-node@v4
        if: steps.changed.outputs.build == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.changed.outputs.build == 'true'
      # 버전 끝자리를 빌드 번호로 맞춰서, 설치한 프로그램이 자기보다 새 릴리스를 알아볼 수 있게 한다.
      - name: 버전에 빌드 번호 넣기
        if: steps.changed.outputs.build == 'true'
        shell: bash
        run: npm pkg set version=0.1.${{ github.run_number }} -w @suite/${{ matrix.app }}
      - run: npm run dist:${{ matrix.app }}
        if: steps.changed.outputs.build == 'true'
      - uses: actions/upload-artifact@v4
        if: steps.changed.outputs.build == 'true'
        with:
          name: ${{ matrix.app }}-windows
          path: apps/${{ matrix.app }}/release/*.exe
      - name: Releases 에 올리기
        if: steps.changed.outputs.build == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ matrix.app }}-build-${{ github.run_number }}"
          gh release create "$tag" apps/${{ matrix.app }}/release/*.exe \
            --target "${{ github.sha }}" \
            --title "${{ matrix.title }} (빌드 ${{ github.run_number }})" \
            --notes "main 의 최신 코드로 자동으로 만든 Windows 설치 파일이에요. 아래 Assets 에서 .exe 를 받아 실행하세요." \
            --latest=${{ matrix.latest }}
