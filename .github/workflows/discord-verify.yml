name: 디스코드 인증 처리

# ✅┃인증 채널에서 ✅ 를 누른 사람에게 🐾 멤버 역할을 준다. 몇 초면 끝나는 짧은 작업이다.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: discord-verify
  cancel-in-progress: false

jobs:
  verify:
    name: ✅ 누른 사람 들여보내기
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/discord
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/discord/verify.mjs
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
